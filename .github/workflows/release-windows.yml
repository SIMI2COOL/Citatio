name: Build and Attach Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .\desktop\requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: powershell
        run: |
          .\desktop\build_windows.ps1

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: powershell
        run: |
          $version = if ("${{ github.event_name }}" -eq "release") { "${{ github.ref_name }}" } else { "manual-${{ github.run_number }}" }
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          $safeVersion = $version -replace '[^0-9A-Za-z\.\-_]', '-'
          $installerName = "Citatio-Setup-$safeVersion"
          iscc /DMyAppVersion=$safeVersion /DMyOutputBaseFilename=$installerName .\desktop\CitatioInstaller.iss
          "INSTALLER_PATH=desktop/dist/$installerName.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload installer artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Citatio-Setup
          path: ${{ env.INSTALLER_PATH }}

      - name: Attach installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.INSTALLER_PATH }}
