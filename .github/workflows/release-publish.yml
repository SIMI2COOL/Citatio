# =============================================================================
# Se ejecuta al PUBLICAR una release (tag v1.0.8, etc.), o manualmente desde Actions.
#
# Si no ves ningún run: GitHub solo usa la rama POR DEFECTO del repo para este evento.
#   Settings → General → Default branch → si trabajás en `dev`, poné **dev** como default
#   (no hace falta usar `main` si no la usás).
#
# “Run workflow” solo sube artefactos de prueba; no adjunta al release.
# =============================================================================

name: Release — Windows installer + Linux tarball

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .\desktop\requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows executable
        shell: powershell
        run: .\desktop\build_windows.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build installer (.exe)
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "manual-${{ github.run_number }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          $safeVersion = $version -replace '[^0-9A-Za-z\.\-_]', '-'
          $installerName = "Citatio-Setup-$safeVersion"
          iscc /DMyAppVersion=$safeVersion /DMyOutputBaseFilename=$installerName .\desktop\CitatioInstaller.iss
          "INSTALLER_PATH=desktop/dist/$installerName.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload installer artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Citatio-Setup
          path: ${{ env.INSTALLER_PATH }}

      - name: Attach installer to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.INSTALLER_PATH }}

  linux:
    name: Linux (.tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt / system libraries (PySide6 + PyInstaller)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-sync1

      - name: Build Linux binary
        run: |
          chmod +x desktop/build_linux.sh
          (cd desktop && ./build_linux.sh)

      - name: Package release tarball
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="manual-${{ github.run_number }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          VERSION="${TAG#v}"
          SAFE=$(echo "$VERSION" | sed 's/[^0-9A-Za-z._-]/-/g')
          ARCHIVE="Citatio-Linux-${SAFE}.tar.gz"
          chmod +x desktop/dist/Citatio
          tar -czvf "$ARCHIVE" -C desktop/dist Citatio
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"
          ls -la "$ARCHIVE"

      - name: Upload tarball artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Citatio-Linux-tarball
          path: ${{ env.ARCHIVE_PATH }}

      - name: Attach tarball to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
