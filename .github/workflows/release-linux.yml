# Builds a PyInstaller one-file binary on Ubuntu and attaches Citatio-Linux-<version>.tar.gz
# to the same GitHub Release as the Windows installer (publish tag v1.0.6, etc.).

name: Build and Attach Linux binary

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt / system libraries (PySide6 + PyInstaller)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-sync1

      - name: Build Linux binary
        run: |
          chmod +x desktop/build_linux.sh
          (cd desktop && ./build_linux.sh)

      - name: Package release tarball
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="manual-${{ github.run_number }}"
          fi
          VERSION="${TAG#v}"
          SAFE=$(echo "$VERSION" | sed 's/[^0-9A-Za-z._-]/-/g')
          ARCHIVE="Citatio-Linux-${SAFE}.tar.gz"
          chmod +x desktop/dist/Citatio
          tar -czvf "$ARCHIVE" -C desktop/dist Citatio
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"
          ls -la "$ARCHIVE"

      - name: Upload tarball artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Citatio-Linux-tarball
          path: ${{ env.ARCHIVE_PATH }}

      - name: Attach tarball to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_PATH }}
